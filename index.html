<!-- =========================
     TYPE TESTER
========================== -->

<section class="tester-section" id="tester">

  <div class="tester-controls">

    <div class="tester-title">
      Type Tester
    </div>

    <div class="control">
      <label for="tester-size">Size</label>

      <input
        type="range"
        id="tester-size"
        min="24"
        max="240"
        value="96"
        step="1"
      >

      <span id="tester-size-value">96 px</span>
    </div>


    <div class="control">
      <label for="tester-weight">Weight</label>

      <input
        type="range"
        id="tester-weight"
        min="100"
        max="900"
        value="400"
        step="1"
      >

      <span id="tester-weight-value">400</span>
    </div>


    <div class="control">
      <label for="tester-tracking">Tracking</label>

      <input
        type="range"
        id="tester-tracking"
        min="-5"
        max="20"
        value="0"
        step="0.1"
      >

      <span id="tester-tracking-value">0</span>
    </div>

  </div>


  <div
    class="tester"
    id="type-tester"
    contenteditable="true"
    spellcheck="false"
  >
    The quick brown fox jumps over the lazy dog
  </div>

</section>
